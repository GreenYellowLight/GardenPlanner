openapi: 3.0.1
info:
  title: Query Item
  description: "The Query Item API is a simple query tool, to retrieve information about items and their locations within a store.\n\n## Security\n\nDepending on the scope held, more or less functionality is available at an endpoint. There are further access controls in place to ensure the scope of the item inventory functionality is within a bounds suitable for the client making the request.\n\n### itm:details\nCan be used to get the item information we have on file for a country\n\nThe Item Query is built following the HATEOAS guidelines.\nWhen using the api, the client should start by first calling the `discovery` operation to get a list of possible links these links can then be followed into perform functions.\n\nIf no correlation token is provided when using this service, it will generate a token for you in the header response."
  termsOfService: https://developer.api.bunnings.com.au/terms
  contact:
    name: Developer
    email: developer@bunnings.com.au
  version: v1.4
servers:
  - url: https://item.api.bunnings.com.au/item
    description: Production API
  - url: https://item.stg.api.bunnings.com.au/item
    description: Test is periodically scrubbed of data.
  - url: https://item.sandbox.api.bunnings.com.au/item
    description: Sandbox is periodically cleaned regenerated
paths:
  '/detail/{countryCode}/{itemNumber}':
    get:
      tags:
        - Items
      summary: Retrieves Item with details. (Auth itm:details)
      description: 'Retrieves the ItemNumber, Description, FamilyTree, UnspscCode, StartDate, EndDate, LastUpdate, TaxInformation,ItemType, MinimumGrades, SaleUnitOfMeasure, ProductOffer, Barcodes, Sourcing, ZoningInformation, RatingsRiskAndCompliance, UsageAttributes.'
      operationId: ITM:003/detail/CountryCode/ItemNumber/GET
      parameters:
        - name: countryCode
          in: path
          description: the ISO 3166-1 Alpha-2 code for the country the item requested belongs to. currently only Australia AU or New Zealand NU
          required: true
          schema:
            $ref: '#/components/schemas/CountryCode'
        - name: itemNumber
          in: path
          description: item number of item
          required: true
          schema:
            type: string
        - name: x-version-api
