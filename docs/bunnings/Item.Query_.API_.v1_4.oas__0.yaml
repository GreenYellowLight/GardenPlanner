          links:
            ITM:003/detail/CountryCode/ItemNumber/GET:
              operationId: ITM:003/detail/CountryCode/ItemNumber/GET
              description: "Get Item Details by country code and ItemNumber.\n\n_Path To Link:_ `$.results[*]`\n\n_Url Template:_ `/details/{countryCode}/{itemNumber}`"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericValidationErrorsProblemDetails'
              example: {"type":"https://problem.api.bunnings.com.au?type=validationError","title":"Bad Request","status":400,"detail":"The request is invalid.","errors":{}}
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MissingResourceProblemDetails'
              example: {"type":"https://problem.api.bunnings.com.au?type=missingResource","title":"ItemLocation not found","status":404,"detail":"Item id: 12345"}
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TooManyRequestsProblemDetails'
              example: {"type":"https://httpstatuses.com/429","title":"Too Many Requests","status":429,"detail":"The user has sent too many requests in a given amount of time. Please retry after 60 seconds.","instance":""}
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenRequestsProblemDetails'
              example: {"type":"https://httpstatuses.com/403","title":"Forbidden","status":403,"detail":"The server understood the request, but is refusing to authorize it. The user isn't authorized to request for the resource.","instance":""}
        '500':
          description: Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorProblemDetails'
              example: {"type":"https://httpstatuses.com/500","title":"Server Error","status":500,"detail":"An error occurred processing your request. We are sorry for the trouble and please try again in a moment.","instance":""}
        '401':
          description: Unauthorized
        5XX:
          description: An unexpected error has occurred
      security:
        - oauth2:
            - itm:details
components:
