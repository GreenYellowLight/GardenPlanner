    ComparisonUom:
      type: object
      properties:
        comparisonUnit:
          type: number
          description: "The price divisor\r\nFor example - if the items are 250mmx250mm tiles, we will want the price per Square Metre.\r\nComparison Unit of Measure = Square Metre\r\nComparison Unit = 0.0625 (it will take 4x4 tiles to make a SQM, and therefore 1 tile is 1/16th of a Square Metre).  $0.80 per tile would be $12.80 per SQM.\r\nNote 1: If the item was a Carton of 16 Tiles, the Comparison Unit will be 1, as the Box is 1 Square Metre.  $10 for the carton would be $10 per SQM.\r\n            \r\nNote 2: If the item was a Carton of 50 Tiles, the Comparison Unit will be 3.125, as the Box would cover 3.125 Square Metres.  $30 for the carton would be $9.60 per SQM."
          format: decimal
        comparisonUnitOfMeasure:
          type: string
          description: The comparison (price per) unit of measure for this product.
          nullable: true
      description: Comparison Unit of Measure and the Comparison Unit
    Correlation:
      type: object
      properties:
        correlationId:
          type: string
          description: Item Correlation Id
          nullable: true
        commonItemNumberFlag:
          type: boolean
          description: "Flag to indicate if it is a common item number.\r\n- True: when this product represented by this Item has or would have the same item-number across all listings.\r\n- False: when this product represented by this Item has or would have different item-numbers in at least one listing.\r\nWhere a single product is determined by having the same CorrelationId in all item listings.\r\nNote: A product can start out with a common item number, then if archived in one country and\r\n brought back again under a new item number, would change to no longer have a common item number."
      description: "For information that informs correlation of an item across countries,\r\nsuch as if the item is common across countries\r\nand if it has a shared item number."
