idingSuppliers":[{"reason":"reason","supplierCode":"str1234","startDate":"2012-12-13T12:12:12Z","endDate":"2012-12-13T12:12:12Z","packQty":123.45,"supplierBarcodes":[{"primary":false,"number":"str12340","level":"1","packaging":[{"part":0,"dimension":{"unitOfMeasure":"Kg","length":2,"width":3,"height":2},"volume":{"unitOfMeasure":"lt","value":2},"weight":{"unitOfMeasure":"kg","net":2.5,"gross":3}}],"hierarchy":{"childBarcode":"Consumer","childQuantity":1,"baseUnitBarcode":"Case12345","baseUnitQuantity":2},"AdditionalDescription":"The description"}],"countriesOfOrigin":[{"country":"st","factory":"str1234"}]}]},"zoningInformation":[{"retailZone":"AU RZ 4","region":"SA","status":"Live","pendingStatus":{"status":"str1234","date":"2012-12-13T12:12:12Z"},"restrictions":[{"type":"RESTRICTED","locations":{"location":["AU"]},"locationRestrictions":"NONE","saleQuantity":{"iD":"324324","alertBaseMessage":"This is alert based message","alertCustomerMessage":"This is alert based message","restrictionSizing":{"maxQuantity":300,"maxLength":20},"validTransactions":{"transaction":"SALE"}},"minimumAge":30}],"fulfilmentDetails":{"deliveryType":{"code":"MET_PARCEL","description":"Metro Parcel"},"freightType":{"code":"MET_PARCEL","description":"Metro Parcel"},"isDirectDelivery":false,"leadTimes":{"supplierDispatch":"3","supplierToBunnings":"3","supplierToCustomer":"2","bunningsDispatch":"1"}},"webCommerceAttributes":{"visible":true,"transactable":true,"inStorePickup":true,"AvailableForDelivery":true,"comment":"Click and Collect/Deliver"}}],"ratingsRiskAndCompliance":{"highRisk":"true","supplierDeclarationsOfConformity":[{"Description":"str1234","URL":"https://www.tempUri.Org"}],"weightRating":{"unitOfMeasure":"str1234","value":123.45},"safetyStandards":{"aCCCMandatoryStandard":"true","standards":[{"standardName":"str1234","referenceNumber":"str1234"}],"safetyDataSheet":{"Description":"This description","URL":"https://www.tempUri.Org"}},"dangerousGood":{"class":"str1234","classPackagingGr