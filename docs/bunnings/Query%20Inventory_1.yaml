      - name: "countryCode"
        in: "path"
        description: ""
        required: true
        schema:
          $ref: "#/components/schemas/CountryCode"
      - name: "locationCodes"
        in: "query"
        description: ""
        required: true
        schema:
          type: "string"
          description: ""
      - name: "itemNumbers"
        in: "query"
        description: ""
        required: true
        schema:
