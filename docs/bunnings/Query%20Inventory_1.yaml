---
openapi: 3.0.1
info:
  title: Query Inventory
  description: "The Query Inventory is a simple query tool, to retrieve information\
    \ about inventory using location code(s) and itemNumber(s).\n\n## Security\n\n\
    Depending on the scope held, more or less functionality is available at an endpoint.\
    \ There are further access controls in place to ensure the scope of the inventory\
    \ lookup functionality is within a bounds suitable for the client making the request.\n\
    \nGet basic inventory information back pertaining to\n\nThe inventory\
    \ API is built following the HATEOAS guidelines. When using the API, the client\
    \ should start by\nfirst calling the `discovery` operation to get a list of possible\
    \ links these links can then be followed\nto perform functions. If no correlation\
    \ token is provided when using this service, it will generate a token for you\
    \ in the header response."
  termsOfService: "http://developer.bunnings.com.au/terms"
  contact:
    name: Developer Support
    email: developer@bunnings.com.au
  version: "1.0"
servers:
  - url: https://inventory.sandbox.api.bunnings.com.au/inventory
    description: BASE URL - For sandbox access (mock data)
  - url: https://inventory.stg.api.bunnings.com.au/inventory
    description: BASE URL - For test access (test data)
  - url: https://inventory.api.bunnings.com.au/inventory
    description: BASE URL - For production access (live data)
paths:
  /discovery:
    get:
      tags:
      - "Discovery"
      summary: Provides an overview to current functionality offered by the API
      description: "Returns a set of links that are valid operational roots in this API.\
        \ These end points can be used for application interaction. Please keep in\ 
        \ mind that some of these link URIs may be templates that will need to be filled\
        \ in to be called."
      operationId: "INV:001/Discovery/GET"
      parameters:
      - name: "x-version-api"
        in: "header"
        description: "The API version the client is calling this endpoint at. When\
          \ calling this API the client must provided the version of the API they\
          \ have been written against this allows the API to correctly support the\
          \ calling clients. Clients are still required to support non breaking changes\
          \ within the same version"
        required: true
        schema:
          type: "string"
        example: "1.0"
      responses:
        "200":
          description: "Success"
          headers:
            ETag:
              description: "An ETag of the resource"
              schema:
                type: "string"
                description: "An ETag of the resource"
                format: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryPoint"
              example:
                _meta:
                  _objectUuid: "acef471b-9093-4e3e-8cf6-78f1006a0642"
                  _objectVersion: "1"
                _links:
                - rel: "INV:001/Discovery/GET"
                  href: "https://inventory.uat.api.bunnings.com.au/inventory/discovery"
                  methods:
                  - "GET"
                - rel: "INV:002/itemstockbyitemandlocation/GET"
                  href: "https://inventory.uat.api.bunnings.com.au/inventory/itemstock/{countryCode}/{locationCode}/{itemNumber}"
                  methods:
                  - "GET"
                - rel: "INV:003/itemstock/inventory/GET"
                  href: "https://inventory.uat.api.bunnings.com.au/inventory/itemstock/inventory/{countryCode}"
                  methods:
                  - "GET"
          links:
            INV:001/Discovery/GET:
              operationId: "INV:001/Discovery/GET"
              description: "Initial discovery endpoint ascertain new entry link availabilities."
            INV:002/itemstockbyitemandlocation/GET:
              operationId: "INV:002/itemstockbyitemandlocation/GET"
              description: "Retrieves item stock by location code and item number."
            INV:003/itemstock/inventory/GET:
              operationId: "INV:003/itemstock/inventory/GET"
              description: "Retrieves item stock by multiple location codes and item\
                \ numbers."
        "400":
          description: "There was a problem with the request. The details are in an\
            \ RFC 7807 compliant problem.  [RFC 7807](https://tools.ietf.org/html/rfc7807)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "401":
          description: "Unauthorized"
        "403":
          description: "Forbidden"
        "429":
          description: "Too many request back off and try again later"
        "500":
          description: "Server Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerErrorProblemDetails"
              example:
                type: "https://httpstatuses.com/500"
                title: "Server Error"
                status: 500
                detail: "An error occurred processing your request. We are sorry for\
                  \ the trouble and please try again in a moment."
                instance: ""
                extensions: {}
        "5XX":
          description: "An unexpected error has occurred"
      security:
      - oauth2:
        - "inv:pub"
      - bearer:
        - "inv:pub"
  /itemStock/inventory/{countryCode}:
    get:
      tags:
      - "StockLevels"
      summary: "Retrieves the inventory details based on location ids and item numbers.\
        \ (Auth inv:pub)"
      description: "retrieves ItemNumber,Store Code,StockCount,LevelIndicator,LevelIndMinStock,TopStockCount,ExpectedStockAvailable,CountryCode."
