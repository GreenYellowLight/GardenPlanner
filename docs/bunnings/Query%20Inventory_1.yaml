      - name: "$select"
        in: "query"
        description: "Select can optionally be used to project only the required properties\
          \ of the entity/entities from the server.\n- list required properties separated\
          \ with a ','.\n- property names are case insensitive.\n- '\\\\*' can be\
          \ used as a wild card for any property.\n- use '/' to address complex type\
          \ properties.\n\nexample: $select=name,address/state,contact/*/phoneNumber"
        schema:
          type: "string"
      - name: "$orderby"
        in: "query"
        description: "Order By can be optionally used to control the sequence the\
          \ entities of the collection are returned in.\nThis collection can have\
          \ a maximum of 1 order properties separated by a ',' character.\nSorting\
          \ can be done in asc or desc order by following the property name by a space\
          \ and then the key words asc or desc.\nIf no direction is specified then\
          \ asc is assumed.\nThis collection can be sorted by the following properties:\n\
          \ - topStockCount\n - stockCount\nexample: $orderby=name desc,address/state\
          \ asc.\ndefault: stockCount"
        schema:
          type: "string"
      responses:
        "200":
          description: "Success"
          headers:
            ETag:
              description: "An ETag of the resource"
              schema:
                type: "string"
                description: "An ETag of the resource"
                format: ""
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/ItemLocationStockLevel"
              example:
              - itemNumber: "1234567"
                countryCode: "AU"
                locationCode: "2010"
                levelIndicator: "GREEN"
                expectedStockAvailable:
                - "2020-11-15T07:25:14.1501466+00:00"
                _meta:
                  _objectUuid: "7d2af473-1216-4390-963d-f38969807642"
                  _objectVersion: "0"
                _links:
                - rel: "INV:002/itemstockbyitemandlocation/GET"
                  href: "https://inventory.uat.api.bunnings.com.au/inventory/itemstock/{countryCode}/{locationCode}/{itemNumber}"
                  methods:
                  - "GET"
                - rel: "INV:003/itemstock/inventory/GET"
                  href: "https://inventory.uat.api.bunnings.com.au/inventory/itemstock/inventory/{countryCode}"
                  methods:
                  - "GET"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorsProblemDetails"
              example:
                errors:
                  ItemNumbers[0]:
                  - "'Item Numbers' must be between 7 and 7 characters. You entered\
                    \ 8 characters."
                  LocationCodes[0]:
                  - "'Location Codes' must be between 4 and 4 characters. You entered\
                    \ 5 characters."
                type: "https://bunnings.com.au/validation-error"
                title: "Bad Request"
                status: 400
                detail: "Please refer to the errors for additional details."
                instance: null
                extensions: {}
        "401":
          description: "Unauthorized"
        "403":
          description: "Forbidden"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenRequestsProblemDetails"
              example:
                type: "https://httpstatuses.com/403"
                title: "Forbidden"
                status: 403
                detail: "The server understood the request, but is refusing to authorize\
                  \ it. The user isn't authorized to request for the resource."
                instance: ""
                extensions: {}
        "404":
          description: "Not Found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissingResourceProblemDetails"
              example:
                type: "https://bunnings.com.au/resource-missing"
                title: "InventoryLocation not found"
                status: 404
                detail: "Inventory id: 12345"
                instance: null
                extensions: {}
        "429":
          description: "Client Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TooManyRequestsProblemDetails"
              example:
                type: "https://httpstatuses.com/429"
                title: "Too Many Requests"
                status: 429
                detail: "The user has sent too many requests in a given amount of\
